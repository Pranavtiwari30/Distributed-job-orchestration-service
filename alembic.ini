# Alembic configuration.
#
# The database URL is deliberately absent: it is read from CONDUCTOR_DATABASE_URL
# inside env.py so that a migration can never be run against the wrong database
# because of a stale value committed to this file.
[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
# Timestamped, ordered filenames so `ls migrations/versions` reads chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
