name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# A new push to a PR cancels the previous run: there is no value in finishing
# CI for a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev
      - name: ruff (lint)
        run: uv run ruff check src tests
      - name: ruff (format)
        run: uv run ruff format --check src tests
      - name: mypy
        run: uv run mypy

  unit:
    name: Unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide the results of the others.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev
      # No database needed: everything under core/ is pure.
      #
      # Coverage is scoped to the modules this job is actually responsible for.
      # The package-wide 85% gate in pyproject belongs to the integration job,
      # which runs the whole suite; applying it here fails by construction,
      # because this job never imports the database, API or worker-loop layers
      # and so can never account for their lines.
      - run: >-
          uv run pytest tests/unit -q
          --cov=conductor.core
          --cov=conductor.worker.executors
          --cov-report=xml
          --cov-fail-under=95

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conductor_test
        ports:
          - 5432:5432
        # The job must not start querying before Postgres accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONDUCTOR_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/conductor_test
      CONDUCTOR_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/conductor_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev
      - name: Verify migrations apply and roll back cleanly
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Fail if the models have drifted from the migrations
        # Catches the commit that changes a model and forgets the migration --
        # which otherwise only surfaces when a deploy fails.
        run: uv run alembic check
      - run: uv run pytest -q --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, unit, integration]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          # On a PR the image is built but not pushed: the build is the test,
          # and a PR from a fork must never gain registry write access.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke test the image
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # Deliberately not `--wait`. The migrate service is a one-shot container
      # that applies migrations and exits 0, and `--wait` waits for every
      # service to be *running or healthy* -- an exited container is neither,
      # so it reports failure on a stack that came up perfectly. Readiness is
      # polled explicitly below instead.
      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the API to become ready
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/readyz; then
              echo "ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "API never became ready within 120s"
          exit 1

      # A container that boots is not the same as a system that works. This
      # drives a real DAG through the real image: three tasks with a
      # dependency edge, executed by the worker replicas, asserted SUCCEEDED.
      - name: Run a workflow end to end through the containers
        run: |
          set -euo pipefail
          API=http://localhost:8000/api/v1

          curl -fsS -X POST "$API/workflows" -H 'Content-Type: application/json' -d '{
            "name": "smoke",
            "tasks": [
              {"key": "first",  "executor": "shell", "params": {"command": "echo one"}},
              {"key": "second", "executor": "shell", "params": {"command": "echo two"},
               "depends_on": ["first"]},
              {"key": "third",  "executor": "shell", "params": {"command": "echo three"},
               "depends_on": ["second"]}
            ]}' > /dev/null

          RUN_ID=$(curl -fsS -X POST "$API/runs" \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: smoke-1' \
            -d '{"workflow_name": "smoke"}' | jq -r .id)
          echo "run: $RUN_ID"

          for attempt in $(seq 1 45); do
            STATE=$(curl -fsS "$API/runs/$RUN_ID" | jq -r .state)
            echo "  [$attempt] $STATE"
            case "$STATE" in
              SUCCEEDED) echo "workflow completed through the container stack"; exit 0 ;;
              FAILED|CANCELLED) echo "run ended in $STATE"; exit 1 ;;
            esac
            sleep 2
          done
          echo "run did not reach a terminal state in 90s"
          exit 1

      # Without this a red smoke job tells you nothing: the containers are
      # torn down and the logs go with them.
      - name: Dump container state on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
