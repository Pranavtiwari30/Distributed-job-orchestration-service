name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# A new push to a PR cancels the previous run: there is no value in finishing
# CI for a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev
      - name: ruff (lint)
        run: uv run ruff check src tests
      - name: ruff (format)
        run: uv run ruff format --check src tests
      - name: mypy
        run: uv run mypy

  unit:
    name: Unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide the results of the others.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev
      # No database needed: everything under core/ is pure.
      #
      # Coverage is scoped to the modules this job is actually responsible for.
      # The package-wide 85% gate in pyproject belongs to the integration job,
      # which runs the whole suite; applying it here fails by construction,
      # because this job never imports the database, API or worker-loop layers
      # and so can never account for their lines.
      - run: >-
          uv run pytest tests/unit -q
          --cov=conductor.core
          --cov=conductor.worker.executors
          --cov-report=xml
          --cov-fail-under=95

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conductor_test
        ports:
          - 5432:5432
        # The job must not start querying before Postgres accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONDUCTOR_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/conductor_test
      CONDUCTOR_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/conductor_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev
      - name: Verify migrations apply and roll back cleanly
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Fail if the models have drifted from the migrations
        # Catches the commit that changes a model and forgets the migration --
        # which otherwise only surfaces when a deploy fails.
        run: uv run alembic check
      - run: uv run pytest -q --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, unit, integration]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          # On a PR the image is built but not pushed: the build is the test,
          # and a PR from a fork must never gain registry write access.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke test the image
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      # Proves the stack actually comes up -- a green test suite says nothing
      # about whether the container starts.
      - run: docker compose up -d --build --wait
      - run: curl --fail --retry 10 --retry-all-errors http://localhost:8000/readyz
      - run: docker compose down -v
        if: always()
